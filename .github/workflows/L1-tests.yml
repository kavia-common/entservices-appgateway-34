name: L1-tests

on:
  workflow_call:
    inputs:
      caller_source:
        description: "Specifies the source type (e.g., local or test framework) for the workflow."
        required: true
        type: string
    secrets:
      RDKCM_RDKE:
        required: true

env:
  BUILD_TYPE: Debug
  THUNDER_REF: "R4.4.1"
  THUNDERTOOLS_REF: "R4.4.3"
  INTERFACES_REF: "develop"
  AUTOMATICS_UNAME: ${{ secrets.AUTOMATICS_UNAME}}
  AUTOMATICS_PASSCODE: ${{ secrets.AUTOMATICS_PASSCODE}}

jobs:
  L1-tests:
    name: Build and run unit tests
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler: [ gcc, clang ]
        coverage: [ with-coverage, without-coverage ]
        exclude:
          - compiler: clang
            coverage: with-coverage
          - compiler: clang
            coverage: without-coverage
          - compiler: gcc
            coverage: without-coverage

    steps:
      - name: Set up cache
        # Cache expensive build/install dirs.
        if: ${{ !env.ACT }}
        id: cache
        uses: actions/cache@v3
        with:
          path: |
            build/Thunder
            build/entservices-apis
            build/ThunderTools
            build/googletest
            install
          key: ${{ runner.os }}-${{ env.THUNDER_REF }}-${{ env.THUNDERTOOLS_REF }}-${{ env.INTERFACES_REF }}-l1tests-only-v1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install jsonref
        run: python3 -m pip install --user -q jsonref

      - name: ACK External Trigger
        run: |
          echo "Message: External Trigger Received for L1 Tests"
          echo "Trigger Source: ${{ inputs.caller_source }}"

      - name: Install packages
        run: |
          sudo apt update
          sudo apt install -y \
            libsqlite3-dev \
            libcurl4-openssl-dev \
            valgrind \
            lcov \
            clang \
            libsystemd-dev \
            libboost-all-dev \
            libwebsocketpp-dev \
            meson \
            libcunit1 \
            libcunit1-dev \
            curl \
            protobuf-compiler-grpc \
            libgrpc-dev \
            libgrpc++-dev \
            libjsoncpp-dev \
            git \
            pkg-config \
            patch \
            ninja-build \
            cmake

      - name: Build trower-base64
        run: |
          if [ ! -d "trower-base64" ]; then
            git clone --depth 1 https://github.com/tdunning/trower-base64.git
          fi
          cd trower-base64
          meson setup build || meson setup build --reconfigure
          ninja -C build
          sudo ninja -C build install

      - name: Checkout entservices-appgateway
        uses: actions/checkout@v3
        with:
          path: entservices-appgateway

      - name: Checkout Thunder
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/Thunder
          path: Thunder
          ref: ${{ env.THUNDER_REF }}

      - name: Checkout ThunderTools
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/ThunderTools
          path: ThunderTools
          ref: ${{ env.THUNDERTOOLS_REF }}

      - name: Checkout googletest
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v3
        with:
          repository: google/googletest
          path: googletest
          ref: v1.15.0

      - name: Checkout entservices-apis
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/entservices-apis
          path: entservices-apis
          ref: ${{ env.INTERFACES_REF }}

      - name: Remove DTV.json (workflow parity with script)
        if: steps.cache.outputs.cache-hit != 'true'
        run: rm -f "$GITHUB_WORKSPACE/entservices-apis/jsonrpc/DTV.json" || true

      - name: Apply patches ThunderTools (from repo)
        run: |
          cd "$GITHUB_WORKSPACE/ThunderTools"
          patch -p1 < "$GITHUB_WORKSPACE/entservices-appgateway/Tests/patches/00010-R4.4-Add-support-for-project-dir.patch" || true

      - name: Build ThunderTools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          cmake -G Ninja \
            -S "$GITHUB_WORKSPACE/ThunderTools" \
            -B build/ThunderTools \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr" \
            -DCMAKE_VERBOSE_MAKEFILE=ON \
            -DPROJECT_DIR="$GITHUB_WORKSPACE"
          cmake --build build/ThunderTools -- -j"$(nproc)"
          cmake --install build/ThunderTools

          # Sanity check: L1 build later requires find_package(ConfigGenerator).
          # ThunderTools install must therefore provide:
          #   install/usr/lib/cmake/ConfigGenerator/ConfigGeneratorConfig.cmake
          test -f "$GITHUB_WORKSPACE/install/usr/lib/cmake/ConfigGenerator/ConfigGeneratorConfig.cmake"

      - name: Configure CMake package discovery for L1 builds
        run: |
          set -euo pipefail
          echo "CMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/install/usr" >> "$GITHUB_ENV"
          echo "ConfigGenerator_DIR=$GITHUB_WORKSPACE/install/usr/lib/cmake/ConfigGenerator" >> "$GITHUB_ENV"

      - name: Apply patches Thunder (from repo)
        run: |
          cd "$GITHUB_WORKSPACE/Thunder"
          patch -p1 < "$GITHUB_WORKSPACE/entservices-appgateway/Tests/patches/Use_Legact_Alt_Based_On_ThunderTools_R4.4.3.patch" || true
          patch -p1 < "$GITHUB_WORKSPACE/entservices-appgateway/Tests/patches/error_code_R4_4.patch" || true
          patch -p1 < "$GITHUB_WORKSPACE/entservices-appgateway/Tests/patches/1004-Add-support-for-project-dir.patch" || true
          patch -p1 < "$GITHUB_WORKSPACE/entservices-appgateway/Tests/patches/RDKEMW-733-Add-ENTOS-IDS.patch" || true
          patch -p1 < "$GITHUB_WORKSPACE/entservices-appgateway/Tests/patches/Jsonrpc_dynamic_error_handling.patch" || true

      - name: Build Thunder
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -G Ninja \
            -S "$GITHUB_WORKSPACE/Thunder" \
            -B build/Thunder \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr" \
            -DCMAKE_VERBOSE_MAKEFILE=ON \
            -DPROJECT_DIR="$GITHUB_WORKSPACE"
          cmake --build build/Thunder -- -j"$(nproc)"
          cmake --install build/Thunder

      - name: Apply patch entservices-apis (from repo)
        run: |
          cd "$GITHUB_WORKSPACE/entservices-apis"
          patch -p1 < "$GITHUB_WORKSPACE/entservices-appgateway/Tests/patches/RDKEMW-1007.patch" || true

      - name: Build entservices-apis
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -G Ninja \
            -S "$GITHUB_WORKSPACE/entservices-apis" \
            -B build/entservices-apis \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr" \
            -DCMAKE_VERBOSE_MAKEFILE=ON
          cmake --build build/entservices-apis -- -j"$(nproc)"
          cmake --install build/entservices-apis

      - name: Build googletest (with coverage flags like script)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -G Ninja \
            -S "$GITHUB_WORKSPACE/googletest" \
            -B build/googletest \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr" \
            -DBUILD_GTEST=ON \
            -DBUILD_GMOCK=ON \
            -DINSTALL_GTEST=ON \
            -DCMAKE_C_FLAGS="-O0 -g --coverage -fprofile-arcs -ftest-coverage" \
            -DCMAKE_CXX_FLAGS="-O0 -g --coverage -fprofile-arcs -ftest-coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DCMAKE_SHARED_LINKER_FLAGS="--coverage" \
            -DCMAKE_VERBOSE_MAKEFILE=ON
          cmake --build build/googletest -- -j"$(nproc)"
          cmake --install build/googletest

      - name: Build AppGateway L1 tests (Tests/L1Tests only; NO install; coverage enabled)
        # Script parity: configure/build ONLY Tests/L1Tests and avoid install-time /etc writes.
        run: |
          set -euo pipefail

          export COVERAGE_C_FLAGS="-O0 -g --coverage -fprofile-arcs -ftest-coverage"
          export COVERAGE_CXX_FLAGS="-O0 -g --coverage -fprofile-arcs -ftest-coverage"
          export COVERAGE_LINKER_FLAGS="--coverage"

          cmake -G Ninja \
            -S "$GITHUB_WORKSPACE/entservices-appgateway/Tests/L1Tests" \
            -B build/entservices-appgateway-l1tests-only \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install/usr" \
            -DWPEFrameworkPlugins_DIR="$GITHUB_WORKSPACE/install/usr/lib/cmake/WPEFrameworkPlugins" \
            -DDISABLE_SECURITY_TOKEN=ON \
            -DUSE_THUNDER_R4=ON \
            -DRDK_SERVICES_L1_TEST=ON \
            -DPLUGIN_APPGATEWAY=ON \
            -DPLUGIN_APPGATEWAYCOMMON=ON \
            -DPLUGIN_APPNOTIFICATIONS=OFF \
            -DCMAKE_C_FLAGS="${COVERAGE_C_FLAGS}" \
            -DCMAKE_CXX_FLAGS="${COVERAGE_CXX_FLAGS}" \
            -DCMAKE_EXE_LINKER_FLAGS="${COVERAGE_LINKER_FLAGS}" \
            -DCMAKE_SHARED_LINKER_FLAGS="${COVERAGE_LINKER_FLAGS}" \
            -DCMAKE_VERBOSE_MAKEFILE=ON

          cmake --build build/entservices-appgateway-l1tests-only -- -j"$(nproc)"
          cmake --build build/entservices-appgateway-l1tests-only --target AppGatewayL1Test -- -j"$(nproc)"

          cmake --build build/entservices-appgateway-l1tests-only --target AppGateway -- -j"$(nproc)" || true
          cmake --build build/entservices-appgateway-l1tests-only --target AppGatewayCommon -- -j"$(nproc)" || true
          cmake --build build/entservices-appgateway-l1tests-only --target L1TestsIN -- -j"$(nproc)" || true

          mkdir -p "$GITHUB_WORKSPACE/install/usr/lib/wpeframework/plugins"
          find build/entservices-appgateway-l1tests-only/AppGateway -maxdepth 1 -type f -name "*.so*" -exec cp -f {} "$GITHUB_WORKSPACE/install/usr/lib/wpeframework/plugins/" \; 2>/dev/null || true
          find build/entservices-appgateway-l1tests-only/AppGatewayCommon -maxdepth 1 -type f -name "*.so*" -exec cp -f {} "$GITHUB_WORKSPACE/install/usr/lib/wpeframework/plugins/" \; 2>/dev/null || true
          find build/entservices-appgateway-l1tests-only -maxdepth 1 -type f -name "*.so*" -exec cp -f {} "$GITHUB_WORKSPACE/install/usr/lib/wpeframework/plugins/" \; 2>/dev/null || true

          ls -la "$GITHUB_WORKSPACE/install/usr/lib/wpeframework/plugins" || true
          test -e "$GITHUB_WORKSPACE/install/usr/lib/wpeframework/plugins/libAppGateway.so" || (echo "Missing libAppGateway.so in staged plugin dir" && exit 1)
          test -e "$GITHUB_WORKSPACE/install/usr/lib/wpeframework/plugins/libAppGatewayCommon.so" || (echo "Missing libAppGatewayCommon.so in staged plugin dir" && exit 1)

      - name: Copy required mock headers into install prefix include/Tests/mocks
        run: |
          mkdir -p "$GITHUB_WORKSPACE/install/usr/include/Tests/mocks"
          cp -f "$GITHUB_WORKSPACE/entservices-appgateway/Tests/mocks/Module.h" "$GITHUB_WORKSPACE/install/usr/include/Tests/mocks/Module.h"
          cp -f "$GITHUB_WORKSPACE/entservices-appgateway/Tests/mocks/ServiceMock.h" "$GITHUB_WORKSPACE/install/usr/include/Tests/mocks/ServiceMock.h"
          cp -f "$GITHUB_WORKSPACE/entservices-appgateway/Tests/mocks/ThunderPortability.h" "$GITHUB_WORKSPACE/install/usr/include/Tests/mocks/ThunderPortability.h"

      - name: Stage AppGateway resolution.base.json into config root (avoid /etc)
        run: |
          mkdir -p /tmp/app-gateway
          cp -f "$GITHUB_WORKSPACE/entservices-appgateway/AppGateway/resolutions/resolution.base.json" /tmp/app-gateway/resolution.base.json
          echo "APPGATEWAY_CONFIG_PATH=/tmp/app-gateway" >> "$GITHUB_ENV"
          ls -la /tmp/app-gateway || true

      - name: Run AppGateway L1 tests (continue-on-error to still generate coverage + upload artifacts)
        continue-on-error: true
        run: |
          set -euo pipefail
          find build/entservices-appgateway-l1tests-only -type f -name "*.gcda" -print -delete 2>/dev/null || true

          export PATH="$GITHUB_WORKSPACE/install/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/install/usr/lib:$GITHUB_WORKSPACE/install/usr/lib64:$GITHUB_WORKSPACE/install/usr/lib/wpeframework/plugins:${LD_LIBRARY_PATH:-}"
          export APPGATEWAY_CONFIG_PATH="${APPGATEWAY_CONFIG_PATH:-/tmp/app-gateway}"
          export GTEST_OUTPUT="json:$(pwd)/AppGatewayL1TestResults.json"

          TEST_BIN="build/entservices-appgateway-l1tests-only/AppGatewayL1Test"
          if [ ! -x "${TEST_BIN}" ]; then
            echo "AppGatewayL1Test not found at ${TEST_BIN}"
            exit 1
          fi

          "${TEST_BIN}"
          rc=$?

          if [ -f "$(pwd)/AppGatewayL1TestResults.json" ]; then
            cp -f "$(pwd)/AppGatewayL1TestResults.json" "$GITHUB_WORKSPACE/entservices-appgateway/AppGatewayL1TestResultsWithoutValgrind.json"
            rm -f "$(pwd)/AppGatewayL1TestResults.json"
          fi

          echo "L1_TEST_EXIT_CODE=${rc}" >> "$GITHUB_ENV"
          exit "${rc}"

      - name: Generate coverage HTML (AppGateway sources only)
        if: ${{ matrix.coverage == 'with-coverage' && !env.ACT }}
        continue-on-error: true
        run: |
          set -euo pipefail

          if [ -f "$GITHUB_WORKSPACE/entservices-appgateway/entservices-testframework/Tests/L1Tests/.lcovrc_l1" ]; then
            cp "$GITHUB_WORKSPACE/entservices-appgateway/entservices-testframework/Tests/L1Tests/.lcovrc_l1" ~/.lcovrc
          fi

          rm -rf coverage coverage.info filtered_coverage.info appgateway_only_coverage.info || true

          lcov --capture \
            --directory build/entservices-appgateway-l1tests-only \
            --output-file coverage.info \
            --ignore-errors mismatch,empty \
            >/dev/null 2>&1 || true

          if [ ! -s coverage.info ]; then
            echo "coverage.info missing/empty; skipping HTML generation"
            exit 0
          fi

          lcov -r coverage.info \
            '/usr/include/*' \
            '*/build/entservices-appgateway-l1tests-only/_deps/*' \
            '*/install/usr/include/*' \
            '*/Tests/headers/*' \
            '*/Tests/mocks/*' \
            '*/Tests/L1Tests/tests/*' \
            '*/Thunder/*' \
            --ignore-errors empty \
            -o filtered_coverage.info || true

          if [ ! -s filtered_coverage.info ]; then
            echo "filtered_coverage.info missing/empty; skipping HTML generation"
            exit 0
          fi

          lcov -e filtered_coverage.info '*/AppGateway/*' --ignore-errors empty -o appgateway_only_coverage.info || true
          if [ ! -s appgateway_only_coverage.info ]; then
            echo "appgateway_only_coverage.info missing/empty; skipping HTML generation"
            exit 0
          fi

          genhtml -o coverage -t "entservices-appgateway (AppGateway-only) coverage" appgateway_only_coverage.info

      - name: Upload artifacts
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-L1-appgateway
          path: |
            coverage/
            entservices-appgateway/AppGatewayL1TestResultsWithoutValgrind.json
          if-no-files-found: warn

      - name: Fail job if L1 tests failed (after artifacts/coverage)
        if: ${{ env.L1_TEST_EXIT_CODE != '' && env.L1_TEST_EXIT_CODE != '0' }}
        run: |
          echo "L1 tests failed with exit code: ${{ env.L1_TEST_EXIT_CODE }}"
          exit 1
